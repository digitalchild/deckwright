name: Docker image

# Pull requests: build and scan the image. Release tags (v*): also push it to GHCR, signed, with an SBOM
# and build provenance.
on:
  pull_request:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build for the scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: deckwright:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: deckwright:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Smoke test
        run: |
          docker run -d --name dw -e DECKWRIGHT_DATA_DIR=/tmp -p 8765:8765 deckwright:scan \
            deckwright server --host 127.0.0.1 --port 8765
          for i in $(seq 1 30); do docker exec dw python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health')" && break; sleep 1; done
          docker exec dw python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health')"
          docker rm -f dw

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write      # push to GHCR
      id-token: write      # keyless cosign signing and provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      # Release: build both platforms once, push under a staging tag, then scan and smoke test that exact
      # digest on each platform. Only then add the version tags and sign. What ships is what was tested.
      - id: push
        name: Build and push (staging tag)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha

      - name: Scan the release image (amd64)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan the release image (arm64)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Smoke test the release image on both platforms
        env:
          REF: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
        run: |
          for platform in linux/amd64 linux/arm64; do
            docker run -d --name dw --platform "$platform" -e DECKWRIGHT_DATA_DIR=/tmp "$REF" \
              deckwright server --host 127.0.0.1 --port 8765
            ok=0
            for i in $(seq 1 60); do
              if docker exec dw python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health')"; then ok=1; break; fi
              sleep 2
            done
            docker rm -f dw
            [ "$ok" = 1 ] || { echo "smoke test failed on $platform"; exit 1; }
            # The runner's image store keeps one platform per digest, so drop it before the next platform pulls.
            docker rmi "$REF"
          done

      - name: Add the version tags
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          REF: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
        run: |
          args=()
          while IFS= read -r tag; do [ -n "$tag" ] && args+=(-t "$tag"); done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" "$REF"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
